# Balanceador: reparte entre las instancias (round-robin)
# y deja de enviar tráfico a una instancia que falla.

# DNS interno de Docker: vuelve a resolver los nombres cada 5 s.
# Así, si una instancia se recrea con otra IP, NGINX la encuentra sin reiniciarse.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream app {
    zone app 64k;
    server app-1:8080 resolve max_fails=1 fail_timeout=10s;
    server app-2:8080 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://app;
        # Si una instancia no responde, reintenta en la otra
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
